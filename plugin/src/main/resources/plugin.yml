name: BarDrinks
version: 1.0
main: me.bardrinks.BarDrinks
api-version: 1.21
softdepend: [Economia]

commands:
  bardrink:
    description: Menu, loja e gerenciamento de bebidas e barris do Bar
    usage: /bardrink [player|bebida|barril|mangueira|menu|loja|ban|desban|list|set|vomitar|apagao]
    aliases: [drink]
    permission: bardrinks.admin
  bebuns:
    description: Ranking dos maiores bebuns do servidor
    usage: /bebuns
    permission: bardrinks.player

permissions:
  bardrinks.admin:
    description: Permissão para criar bebidas, usar /loja bar e gerenciar barris (Barman/Staff)
    default: op
  bardrinks.player:
    description: Permissão para ver o ranking de bebuns (Todos)
    default: true
